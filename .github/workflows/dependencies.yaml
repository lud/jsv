name: "Mix Dependency Submission"

on:
  push:
    branches:
      - "main"
    paths:
      - "mix.lock"
      - "mix.exs"

# The API requires write permission on the repository to submit dependencies
permissions:
  contents: write

jobs:
  report_mix_deps:
    name: "Report Mix Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The action fetches its binary from the release CDN and verifies it
      # through the attestations API, both of which fail transiently. The tool
      # can also exit with an error after GitHub accepted the snapshot, so the
      # snapshot-id output is the success signal rather than the exit code.
      - id: submit_1
        uses: erlef/mix-dependency-submission@v1
        continue-on-error: true

      - if: steps.submit_1.outcome == 'failure' && steps.submit_1.outputs.snapshot-id == ''
        run: |
          rm -f "$RUNNER_TEMP/mix_dependency_submission"
          sleep 30
      - id: submit_2
        if: steps.submit_1.outcome == 'failure' && steps.submit_1.outputs.snapshot-id == ''
        uses: erlef/mix-dependency-submission@v1
        continue-on-error: true

      - if: steps.submit_2.outcome == 'failure' && steps.submit_2.outputs.snapshot-id == ''
        run: |
          rm -f "$RUNNER_TEMP/mix_dependency_submission"
          sleep 60
      - id: submit_3
        if: steps.submit_2.outcome == 'failure' && steps.submit_2.outputs.snapshot-id == ''
        uses: erlef/mix-dependency-submission@v1
        continue-on-error: true

      - name: "Check Submission"
        env:
          SNAPSHOT_ID: ${{ steps.submit_1.outputs.snapshot-id || steps.submit_2.outputs.snapshot-id || steps.submit_3.outputs.snapshot-id }}
          OUTCOMES: ${{ steps.submit_1.outcome }} ${{ steps.submit_2.outcome }} ${{ steps.submit_3.outcome }}
        run: |
          if [ -z "$SNAPSHOT_ID" ]; then
            echo "::error::No dependency snapshot was submitted (attempts: $OUTCOMES)"
            exit 1
          fi
          echo "Submitted snapshot $SNAPSHOT_ID (attempts: $OUTCOMES)"
          case "$OUTCOMES" in
            *success*) ;;
            *) echo "::warning::The snapshot was accepted but the submission tool exited with an error" ;;
          esac
